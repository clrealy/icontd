# icontd: app stores are blocked. even if a package pulls these in as a
# dependency, pacman never puts these files on disk.
NoExtract = usr/bin/plasma-discover usr/bin/gnome-software
NoExtract = usr/lib/DiscoverNotifier usr/lib/*/libexec/DiscoverNotifier
NoExtract = usr/share/applications/org.kde.discover* usr/share/applications/org.gnome.Software*
NoExtract = etc/xdg/autostart/org.kde.discover.notifier.desktop etc/xdg/autostart/org.gnome.Software.desktop
NoExtract = usr/lib/systemd/user/gnome-software*
